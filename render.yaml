# Déploiement Render.com (Blueprint). Un disque persistant est OBLIGATOIRE (base SQLite + fichiers clients).
services:
  - type: web
    name: digifaso
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: digifaso-data
      mountPath: /data
      sizeGB: 1
